<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conformance Agent: system architecture</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1c2430; --muted: #5f6b7a; --border: #cfd6de; --line: #44505e;
    --web: #e6f0fa;  --web-edge: #0b5cad;
    --ai: #efe9fb;   --ai-edge: #6a3fc1;
    --data: #e5f4ec; --data-edge: #1d7a4b;
    --ext: #f3f4f6;  --ext-edge: #6b7785;
    --cfg: #fbf1e2;  --cfg-edge: #a8650a;
    --zone: #fafbfc; --loop: #fff8e6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161c; --panel: #1a2029; --text: #e4e8ee; --muted: #98a3b1; --border: #2c3542; --line: #aab4c0;
      --web: #16283d;  --web-edge: #4c9be8;
      --ai: #251b3d;   --ai-edge: #a785ea;
      --data: #13291f; --data-edge: #4fbf86;
      --ext: #20262f;  --ext-edge: #8a96a5;
      --cfg: #2e2312;  --cfg-edge: #e0a14a;
      --zone: #161b22; --loop: #221e12;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1240px; margin: 0 auto; padding: 32px 16px 48px; }
  nav { font-size: 13px; margin-bottom: 18px; color: var(--muted); }
  nav a { color: inherit; margin-right: 14px; }
  svg a:hover rect { stroke-width: 3; }
  svg a { cursor: pointer; }
  a { color: var(--muted); }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 22px; max-width: 920px; }
  h2 { font-size: 17px; margin: 34px 0 10px; }
  p, ol, ul { max-width: 920px; }
  li { margin-bottom: 7px; }
  .figure { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; overflow-x: auto; }
  svg { display: block; width: 100%; min-width: 1000px; height: auto; }
  svg text { fill: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  svg .zl { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; fill: var(--muted); }
  svg .t { font-size: 15px; font-weight: 700; }
  svg .p { font: 11.5px ui-monospace, Consolas, monospace; fill: var(--muted); }
  svg .d { font-size: 12.5px; }
  svg .al { font-size: 11.5px; fill: var(--muted); }
  svg .alm { font: 11.5px ui-monospace, Consolas, monospace; fill: var(--muted); }
  svg .ml { font-size: 12px; text-anchor: middle; paint-order: stroke; stroke: var(--panel); stroke-width: 4px; }
  svg .mlm { font: 11.5px ui-monospace, Consolas, monospace; text-anchor: middle; paint-order: stroke; stroke: var(--panel); stroke-width: 4px; }
  svg .hd { font-size: 13px; font-weight: 700; text-anchor: middle; }
  svg .hp { font: 11px ui-monospace, Consolas, monospace; fill: var(--muted); text-anchor: middle; }
  svg .note { font-size: 11.5px; fill: var(--muted); }
  .zone { fill: var(--zone); stroke: var(--border); stroke-width: 1.2; stroke-dasharray: 6 4; }
  .b { stroke-width: 1.6; }
  .web { fill: var(--web); stroke: var(--web-edge); }
  .ai { fill: var(--ai); stroke: var(--ai-edge); }
  .data { fill: var(--data); stroke: var(--data-edge); }
  .ext { fill: var(--ext); stroke: var(--ext-edge); }
  .cfg { fill: var(--cfg); stroke: var(--cfg-edge); }
  .arrow { stroke: var(--line); stroke-width: 1.7; fill: none; marker-end: url(#head); }
  .ret { stroke-dasharray: 5 4; }
  .life { stroke: var(--border); stroke-width: 1.5; stroke-dasharray: 4 4; }
  .loop { fill: var(--loop); stroke: var(--cfg-edge); stroke-width: 1.2; }
  #head path, #head2 path { fill: var(--line); }
  .legend { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 12px; font-size: 13px; color: var(--muted); }
  .legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; border: 1.5px solid; }
  .l-web::before { background: var(--web); border-color: var(--web-edge) !important; }
  .l-ai::before { background: var(--ai); border-color: var(--ai-edge) !important; }
  .l-data::before { background: var(--data); border-color: var(--data-edge) !important; }
  .l-ext::before { background: var(--ext); border-color: var(--ext-edge) !important; }
  .l-cfg::before { background: var(--cfg); border-color: var(--cfg-edge) !important; }
  code { font: 13px ui-monospace, Consolas, monospace; background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
  table { border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); font-size: 14px; width: 100%; }
  th, td { padding: 8px 11px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
  thead th { font-size: 12px; color: var(--muted); }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
  @media (max-width: 820px) { .cols { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <nav><a href="../index.html"><strong>Open the chat</strong></a><a href="system_architecture.html">System architecture</a><a href="agent_methodology.html">Agent methodology</a><a href="data_architecture.html">Data architecture</a><a href="gold_star_schema.html">Gold layer</a><a href="silver_layer.html">Silver layer</a><a href="bronze_data_diagram.html">Bronze layer</a></nav>

  <h1>Trading Conformance Agent: system architecture</h1>

  <h2>Components</h2>
  <div class="figure">
    <svg viewBox="0 0 1200 730" role="img" aria-label="Component diagram: chat page, report checker, agent, reference files, memory, in-browser database and data loader in the browser tab, connected to the language model and cloud storage">
      <defs>
        <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z"/></marker>
      </defs>

      <rect class="zone" x="20" y="40" width="720" height="670" rx="12"/>
      <text class="zl" x="34" y="64">ANALYST'S BROWSER TAB</text>

      <!-- browser row 1 -->
      <a href="../index.html" aria-label="Open the chat"><rect class="b web" x="40" y="80" width="200" height="150" rx="10"/>
      <text class="t" x="54" y="106">Chat page</text>
      <text class="p" x="54" y="125">index.html, web/ui/app.js</text>
      <text class="d" x="54" y="152">Enter keys form: database</text>
      <text class="d" x="54" y="170">key and AI API key, not saved.</text>
      <text class="d" x="54" y="194">Attach a client report.</text>
      <text class="d" x="54" y="212">Shows answers and results.</text></a>

      <rect class="b ai" x="290" y="80" width="220" height="150" rx="10"/>
      <text class="t" x="304" y="106">Agent</text>
      <text class="p" x="304" y="125">web/agent/agent.js, retrieve.js</text>
      <text class="d" x="304" y="152">Retrieves facts first, then</text>
      <text class="d" x="304" y="170">sends the request: 7 tools,</text>
      <text class="d" x="304" y="194">9 with a report. Runs each</text>
      <text class="d" x="304" y="212">tool call, up to 12 rounds.</text>

      <!-- browser row 2 -->
      <rect class="b web" x="40" y="330" width="200" height="130" rx="10"/>
      <text class="t" x="54" y="356">Report checker</text>
      <text class="p" x="54" y="375">web/reports/attachments.js</text>
      <text class="p" x="54" y="391">conformance.js</text>
      <text class="p" x="54" y="407">client_report.js</text>
      <text class="d" x="54" y="430">Checks each test step;</text>
      <text class="d" x="54" y="448">writes the client report.</text>

      <rect class="b data" x="290" y="330" width="220" height="130" rx="10"/>
      <text class="t" x="304" y="356">In-browser database</text>
      <text class="p" x="304" y="375">DuckDB-WASM, in memory</text>
      <text class="d" x="304" y="402">9 gold tables. File, network</text>
      <text class="d" x="304" y="420">and settings access switched</text>
      <text class="d" x="304" y="438">off after loading.</text>

      <rect class="b ai" x="540" y="330" width="180" height="130" rx="10"/>
      <text class="t" x="554" y="356">Reference files</text>
      <text class="p" x="554" y="375">web/knowledge/</text>
      <text class="d" x="554" y="402">core.md with every</text>
      <text class="d" x="554" y="420">question; 13 topic files and</text>
      <text class="d" x="554" y="438">reject_codes.json on request</text>

      <!-- browser row 3 -->
      <rect class="b cfg" x="40" y="540" width="200" height="150" rx="10"/>
      <text class="t" x="54" y="566">Memory</text>
      <text class="p" x="54" y="585">agent/memory.js, IndexedDB</text>
      <text class="d" x="54" y="612">Saved conversations and</text>
      <text class="d" x="54" y="630">memory notes, in this</text>
      <text class="d" x="54" y="648">browser only. Notes are</text>
      <text class="d" x="54" y="666">sent with every question.</text>

      <rect class="b data" x="290" y="560" width="220" height="110" rx="10"/>
      <text class="t" x="304" y="586">Data loader</text>
      <text class="p" x="304" y="605">web/agent/data.js</text>
      <text class="d" x="304" y="632">Downloads gold/ from cloud</text>
      <text class="d" x="304" y="650">storage, creates the 9 tables.</text>

      <rect class="b data" x="800" y="570" width="360" height="100" rx="10"/>
      <text class="t" x="814" y="596">Cloud storage</text>
      <text class="p" x="814" y="615">private folder gold/</text>
      <text class="d" x="814" y="640">9 Parquet files and manifest.json</text>

      <!-- arrows: chat and agent -->
      <path class="arrow" d="M240,130 H286"/>
      <path class="arrow ret" d="M286,180 H244"/>
      <text class="al" x="244" y="122">question</text>
      <text class="al" x="248" y="198">answer</text>

      <!-- chat and report checker -->
      <path class="arrow" d="M100,230 V326"/>
      <path class="arrow ret" d="M180,326 V234"/>
      <text class="al" x="108" y="274">report</text>
      <text class="al" x="108" y="290">file</text>
      <text class="al" x="188" y="274">results,</text>
      <text class="al" x="188" y="290">files</text>

      <!-- report checker and database -->
      <path class="arrow" d="M240,375 H286"/>
      <path class="arrow ret" d="M286,425 H244"/>
      <text class="alm" x="244" y="368">IDs</text>
      <text class="al" x="250" y="443">rows</text>

      <!-- language model -->
      <rect class="b ai" x="800" y="80" width="360" height="110" rx="10"/>
      <text class="t" x="814" y="106">Language model</text>
      <text class="d" x="814" y="134">Model used:</text>
      <text class="p" x="814" y="156">nvidia/nemotron-3.5-lightning:free</text>

      <!-- agent and language model -->
      <path class="arrow" d="M510,120 H796"/>
      <text class="al" x="520" y="112">conversation, tool definitions, language model key</text>
      <path class="arrow ret" d="M796,170 H514"/>
      <text class="al" x="520" y="162">a tool call, or the answer text</text>

      <!-- agent and database -->
      <path class="arrow" d="M380,230 V326"/>
      <path class="arrow ret" d="M430,326 V234"/>
      <text class="alm" x="324" y="282">SELECT</text>
      <text class="al" x="438" y="282">at most 200 rows</text>

      <!-- reference to agent -->
      <path class="arrow ret" d="M630,326 V205 H514"/>
      <text class="al" x="638" y="268">reference text</text>

      <!-- memory and agent: notes and earlier conversations sent with each question; notes saved by the model -->
      <path class="arrow" d="M240,600 H273 V216 H286"/>
      <path class="arrow ret" d="M283,222 V640 H244"/>
      <text class="al" transform="translate(267,520) rotate(-90)" style="text-anchor:middle">notes, conversations</text>

      <!-- loader -->
      <path class="arrow" d="M400,560 V464"/>
      <path class="arrow" d="M800,620 H514"/>
      <text class="al" x="530" y="612">gold/ files, downloaded with the</text>
      <text class="al" x="530" y="640">cloud storage publishable key</text>
    </svg>
    <div class="legend">
      <span class="l-web">Chat page and report checker</span>
      <span class="l-ai">Agent, language model and reference</span>
      <span class="l-data">Message data</span>
      <span class="l-cfg">Memory in this browser</span>
      <span>Dashed arrow: a reply</span>
    </div>
  </div>
</main>
</body>
</html>
