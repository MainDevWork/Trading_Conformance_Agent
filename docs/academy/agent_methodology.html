<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How the chat agent answers a question</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1c2430; --muted: #5f6b7a; --border: #cfd6de; --line: #44505e;
    --web: #e6f0fa;  --web-edge: #0b5cad;
    --ai: #efe9fb;   --ai-edge: #6a3fc1;
    --data: #e5f4ec; --data-edge: #1d7a4b;
    --dec: #fbf1e2;  --dec-edge: #a8650a;
    --badge: #1c2430; --badge-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161c; --panel: #1a2029; --text: #e4e8ee; --muted: #98a3b1; --border: #2c3542; --line: #aab4c0;
      --web: #16283d;  --web-edge: #4c9be8;
      --ai: #251b3d;   --ai-edge: #a785ea;
      --data: #13291f; --data-edge: #4fbf86;
      --dec: #2e2312;  --dec-edge: #e0a14a;
      --badge: #e4e8ee; --badge-text: #12161c;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1000px; margin: 0 auto; padding: 32px 16px 48px; }
  nav { font-size: 13px; margin-bottom: 18px; color: var(--muted); }
  nav a { color: inherit; margin-right: 14px; }
  a { color: var(--muted); }
  h1 { font-size: 24px; margin: 0 0 8px; }
  h2 { font-size: 18px; margin: 34px 0 10px; }
  p, ol, ul { max-width: 860px; }
  li { margin-bottom: 7px; }
  code { font: 13px ui-monospace, Consolas, monospace; background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
  .figure { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  svg { display: block; width: 100%; max-width: 900px; margin: 0 auto; height: auto; }
  svg text { fill: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  svg .ph { font-size: 12px; font-weight: 700; letter-spacing: .06em; fill: var(--muted); }
  svg .t { font-size: 15px; font-weight: 700; text-anchor: middle; }
  svg .s { font-size: 12.5px; fill: var(--muted); text-anchor: middle; }
  svg .sm { font: 12px ui-monospace, Consolas, monospace; fill: var(--muted); text-anchor: middle; }
  svg .dt { font-size: 13.5px; font-weight: 700; text-anchor: middle; }
  svg .yn { font-size: 12.5px; font-weight: 700; fill: var(--dec-edge); }
  svg .tl { font-size: 12.5px; }
  svg .tlm { font: 12px ui-monospace, Consolas, monospace; font-weight: 700; }
  .b { stroke-width: 1.6; }
  .web { fill: var(--web); stroke: var(--web-edge); }
  .ai { fill: var(--ai); stroke: var(--ai-edge); }
  .data { fill: var(--data); stroke: var(--data-edge); }
  .dec { fill: var(--dec); stroke: var(--dec-edge); }
  .arrow { stroke: var(--line); stroke-width: 1.7; fill: none; marker-end: url(#head); }
  #head path { fill: var(--line); }
  .badge circle { fill: var(--badge); }
  .badge text { fill: var(--badge-text); font-size: 12px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
  .legend { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 12px; font-size: 13px; color: var(--muted); justify-content: center; }
  .legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; border: 1.5px solid; }
  .l-web::before { background: var(--web); border-color: var(--web-edge) !important; }
  .l-ai::before { background: var(--ai); border-color: var(--ai-edge) !important; }
  .l-data::before { background: var(--data); border-color: var(--data-edge) !important; }
  .l-dec::before { background: var(--dec); border-color: var(--dec-edge) !important; }
  table { border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); font-size: 14px; width: 100%; }
  th, td { padding: 8px 11px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
  thead th { font-size: 12px; color: var(--muted); }
  td.r { text-align: right; white-space: nowrap; }
  .pdf { font-size: 13px; }
  @media print {
    :root {
      --bg: #ffffff; --panel: #ffffff; --text: #1c2430; --muted: #4a5563; --border: #cfd6de; --line: #44505e;
      --web: #e6f0fa;  --web-edge: #0b5cad; --ai: #efe9fb; --ai-edge: #6a3fc1;
      --data: #e5f4ec; --data-edge: #1d7a4b; --dec: #fbf1e2; --dec-edge: #a8650a;
      --badge: #1c2430; --badge-text: #ffffff;
    }
    @page { size: A4; margin: 14mm 14mm 16mm; }
    body { font-size: 11pt; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    main { padding: 0; max-width: none; }
    nav, .pdf { display: none; }
    .figure { border: none; padding: 0; }
    .legend { margin-top: 2mm; font-size: 9pt; }
    svg { width: auto; max-width: none; height: 180mm; }
    h2 { break-after: avoid; }
    table, li { break-inside: avoid; }
  }
</style>
</head>
<body>
<main>
  <nav><a href="../../index.html"><strong>Open the chat</strong></a><a href="system_architecture.html">System architecture</a><a href="agent_methodology.html">Agent methodology</a><a href="data_architecture.html">Data architecture</a><a href="gold_star_schema.html">Gold star schema</a><a href="silver_data_diagram.html">Silver layer</a></nav>

  <p class="pdf"><a href="agent_methodology.pdf">PDF version</a></p>

  <div class="figure">
    <svg viewBox="0 0 1000 1400" role="img" aria-label="Flowchart of how the chat agent loads the data once and then answers each question in rounds of model requests and tool calls">
      <defs>
        <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z"/></marker>
      </defs>

      <text class="ph" x="130" y="30">ONCE, WHEN THE STORAGE KEY IS ENTERED</text>

      <rect class="b web" x="130" y="45" width="340" height="70" rx="10"/>
      <text class="t" x="300" y="75">Analyst enters the storage key</text>
      <text class="sm" x="300" y="97">web/app.js</text>
      <g class="badge"><circle cx="130" cy="45" r="13"/><text x="130" y="45">A</text></g>

      <rect class="b data" x="130" y="145" width="340" height="80" rx="10"/>
      <text class="t" x="300" y="173">Get the 9 gold tables</text>
      <text class="s" x="300" y="194">from cloud storage, or from the copy</text>
      <text class="s" x="300" y="211">saved in this browser</text>
      <g class="badge"><circle cx="130" cy="145" r="13"/><text x="130" y="145">B</text></g>

      <rect class="b data" x="130" y="255" width="340" height="80" rx="10"/>
      <text class="t" x="300" y="283">Create the tables in the browser</text>
      <text class="s" x="300" y="304">in-browser database (DuckDB-WASM);</text>
      <text class="s" x="300" y="321">file and network access switched off</text>
      <g class="badge"><circle cx="130" cy="255" r="13"/><text x="130" y="255">C</text></g>

      <path class="arrow" d="M300,115 V141"/>
      <path class="arrow" d="M300,225 V251"/>
      <path class="arrow" d="M300,335 V386" style="stroke-dasharray:5 4"/>

      <text class="ph" x="130" y="375">FOR EVERY QUESTION</text>

      <rect class="b web" x="130" y="390" width="340" height="70" rx="10"/>
      <text class="t" x="300" y="420">Analyst asks a question</text>
      <text class="s" x="300" y="442">added to the conversation</text>
      <g class="badge"><circle cx="130" cy="390" r="13"/><text x="130" y="390">1</text></g>

      <rect class="b ai" x="130" y="490" width="340" height="100" rx="10"/>
      <text class="t" x="300" y="516">Agent builds the request</text>
      <text class="s" x="300" y="538">instructions and core reference</text>
      <text class="s" x="300" y="555">every table's columns and their meanings</text>
      <text class="s" x="300" y="572">the whole conversation · 5 tool definitions</text>
      <g class="badge"><circle cx="130" cy="490" r="13"/><text x="130" y="490">2</text></g>

      <rect class="b ai" x="130" y="620" width="340" height="70" rx="10"/>
      <text class="t" x="300" y="648">Send the request to the language model</text>
      <text class="sm" x="300" y="670">nvidia/nemotron-3.5-lightning:free</text>
      <g class="badge"><circle cx="130" cy="620" r="13"/><text x="130" y="620">3</text></g>

      <polygon class="b dec" points="300,715 440,765 300,815 160,765"/>
      <text class="dt" x="300" y="760">Does the reply</text>
      <text class="dt" x="300" y="778">call any tools?</text>
      <g class="badge"><circle cx="160" cy="765" r="13"/><text x="160" y="765">4</text></g>

      <rect class="b data" x="130" y="845" width="340" height="80" rx="10"/>
      <text class="t" x="300" y="873">Agent runs each tool call</text>
      <text class="s" x="300" y="894">on the in-browser tables or</text>
      <text class="s" x="300" y="911">the reference files</text>
      <g class="badge"><circle cx="130" cy="845" r="13"/><text x="130" y="845">5</text></g>

      <rect class="b ai" x="130" y="955" width="340" height="80" rx="10"/>
      <text class="t" x="300" y="983">Add the results to the conversation</text>
      <text class="s" x="300" y="1004">each result cut to at most 200 rows</text>
      <text class="s" x="300" y="1021">and 30,000 characters</text>
      <g class="badge"><circle cx="130" cy="955" r="13"/><text x="130" y="955">6</text></g>

      <polygon class="b dec" points="300,1060 440,1110 300,1160 160,1110"/>
      <text class="dt" x="300" y="1106">12 requests to the</text>
      <text class="dt" x="300" y="1124">model used?</text>
      <g class="badge"><circle cx="160" cy="1110" r="13"/><text x="160" y="1110">7</text></g>

      <rect class="b ai" x="130" y="1190" width="340" height="80" rx="10"/>
      <text class="t" x="300" y="1218">One last request, tools switched off</text>
      <text class="s" x="300" y="1239">the model must answer from the</text>
      <text class="s" x="300" y="1256">results it already has</text>

      <rect class="b web" x="130" y="1310" width="340" height="70" rx="10"/>
      <text class="t" x="300" y="1340">Page shows the answer text</text>
      <text class="s" x="300" y="1362">the queries are not shown</text>
      <g class="badge"><circle cx="130" cy="1310" r="13"/><text x="130" y="1310">8</text></g>

      <!-- main arrows -->
      <path class="arrow" d="M300,460 V486"/>
      <path class="arrow" d="M300,590 V616"/>
      <path class="arrow" d="M300,690 V711"/>
      <path class="arrow" d="M300,815 V841"/>
      <text class="yn" x="308" y="836">Yes</text>
      <path class="arrow" d="M300,925 V951"/>
      <path class="arrow" d="M300,1035 V1056"/>
      <path class="arrow" d="M300,1160 V1186"/>
      <text class="yn" x="308" y="1180">Yes</text>
      <path class="arrow" d="M300,1270 V1306"/>

      <!-- No from decision 4: straight to the answer -->
      <path class="arrow" d="M160,765 H60 V1345 H126"/>
      <text class="yn" x="100" y="757">No</text>
      <text class="yn" transform="translate(52,1060) rotate(-90)" style="text-anchor:middle">No tool call: the reply is the answer</text>

      <!-- No from decision 7: next round -->
      <path class="arrow" d="M440,1110 H560 V655 H474"/>
      <text class="yn" x="450" y="1100">No</text>
      <text class="s" x="568" y="720" style="text-anchor:start">next round</text>

      <!-- tools -->
      <rect class="b data" x="610" y="790" width="370" height="190" rx="10"/>
      <text class="tl" x="626" y="816" style="font-weight:700">The 5 tools the model can call</text>
      <text class="tlm" x="626" y="844">run_sql</text><text class="tl" x="730" y="844">runs one SELECT query on the tables</text>
      <text class="tlm" x="626" y="870">describe_table</text><text class="tl" x="738" y="870">common values of each column</text>
      <text class="tlm" x="626" y="896">list_tables</text><text class="tl" x="718" y="896">every table and column</text>
      <text class="tlm" x="626" y="922">read_reference</text><text class="tl" x="740" y="922">one JSE reference topic</text>
      <text class="tlm" x="626" y="948">lookup_reject_codes</text><text class="tl" x="776" y="948">reject code meanings</text>
      <path class="arrow" d="M606,885 H474" style="stroke-dasharray:5 4"/>
    </svg>
    <div class="legend">
      <span class="l-web">Chat page and analyst</span>
      <span class="l-ai">Agent and language model</span>
      <span class="l-data">Data and tools</span>
      <span class="l-dec">Decision</span>
    </div>
  </div>
</main>
</body>
</html>
