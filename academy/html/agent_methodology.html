<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent methodology: agentic RAG</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1c2430; --muted: #5f6b7a; --border: #cfd6de; --line: #44505e;
    --web: #e6f0fa;  --web-edge: #0b5cad;
    --ai: #efe9fb;   --ai-edge: #6a3fc1;
    --data: #e5f4ec; --data-edge: #1d7a4b;
    --dec: #fbf1e2;  --dec-edge: #a8650a;
    --badge: #1c2430; --badge-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161c; --panel: #1a2029; --text: #e4e8ee; --muted: #98a3b1; --border: #2c3542; --line: #aab4c0;
      --web: #16283d;  --web-edge: #4c9be8;
      --ai: #251b3d;   --ai-edge: #a785ea;
      --data: #13291f; --data-edge: #4fbf86;
      --dec: #2e2312;  --dec-edge: #e0a14a;
      --badge: #e4e8ee; --badge-text: #12161c;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1000px; margin: 0 auto; padding: 32px 16px 48px; }
  nav { font-size: 13px; margin-bottom: 18px; color: var(--muted); }
  nav a { color: inherit; margin-right: 14px; }
  a { color: var(--muted); }
  h1 { font-size: 24px; margin: 0 0 8px; }
  h2 { font-size: 18px; margin: 34px 0 10px; }
  p, ol, ul { max-width: 860px; }
  li { margin-bottom: 7px; }
  code { font: 13px ui-monospace, Consolas, monospace; background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
  .figure { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  svg { display: block; width: 100%; max-width: 900px; margin: 0 auto; height: auto; }
  svg text { fill: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  svg .ph { font-size: 12px; font-weight: 700; letter-spacing: .06em; fill: var(--muted); }
  svg .t { font-size: 15px; font-weight: 700; text-anchor: middle; }
  svg .s { font-size: 12.5px; fill: var(--muted); text-anchor: middle; }
  svg .sm { font: 12px ui-monospace, Consolas, monospace; fill: var(--muted); text-anchor: middle; }
  svg .dt { font-size: 13.5px; font-weight: 700; text-anchor: middle; }
  svg .yn { font-size: 12.5px; font-weight: 700; fill: var(--dec-edge); }
  svg .tl { font-size: 12.5px; }
  svg .tlm { font: 12px ui-monospace, Consolas, monospace; font-weight: 700; }
  .b { stroke-width: 1.6; }
  .web { fill: var(--web); stroke: var(--web-edge); }
  .ai { fill: var(--ai); stroke: var(--ai-edge); }
  .data { fill: var(--data); stroke: var(--data-edge); }
  .dec { fill: var(--dec); stroke: var(--dec-edge); }
  .arrow { stroke: var(--line); stroke-width: 1.7; fill: none; marker-end: url(#head); }
  #head path { fill: var(--line); }
  .badge circle { fill: var(--badge); }
  .badge text { fill: var(--badge-text); font-size: 12px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
  .legend { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 12px; font-size: 13px; color: var(--muted); justify-content: center; }
  .legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; border: 1.5px solid; }
  .l-web::before { background: var(--web); border-color: var(--web-edge) !important; }
  .l-ai::before { background: var(--ai); border-color: var(--ai-edge) !important; }
  .l-data::before { background: var(--data); border-color: var(--data-edge) !important; }
  .l-dec::before { background: var(--dec); border-color: var(--dec-edge) !important; }
  table { border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); font-size: 14px; width: 100%; }
  th, td { padding: 8px 11px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
  thead th { font-size: 12px; color: var(--muted); }
  td.r { text-align: right; white-space: nowrap; }
  @media print {
    :root {
      --bg: #ffffff; --panel: #ffffff; --text: #1c2430; --muted: #4a5563; --border: #cfd6de; --line: #44505e;
      --web: #e6f0fa;  --web-edge: #0b5cad; --ai: #efe9fb; --ai-edge: #6a3fc1;
      --data: #e5f4ec; --data-edge: #1d7a4b; --dec: #fbf1e2; --dec-edge: #a8650a;
      --badge: #1c2430; --badge-text: #ffffff;
    }
    @page { size: A4; margin: 14mm 14mm 16mm; }
    body { font-size: 11pt; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    main { padding: 0; max-width: none; }
    nav { display: none; }
    .figure { border: none; padding: 0; }
    .legend { margin-top: 2mm; font-size: 9pt; }
    h1 { font-size: 15pt; margin: 0 0 4mm; }
    svg { width: auto; max-width: none; height: 235mm; }
    h2 { break-after: avoid; }
    table, li { break-inside: avoid; }
  }
</style>
</head>
<body>
<main>
  <nav><a href="../../index.html"><strong>Open the chat</strong></a><a href="system_architecture.html">System architecture</a><a href="agent_methodology.html">Agent methodology</a><a href="data_architecture.html">Data architecture</a><a href="gold_star_schema.html">Gold layer</a><a href="silver_layer.html">Silver layer</a><a href="bronze_data_diagram.html">Bronze layer</a></nav>

  <h1>Agent methodology: agentic RAG (retrieval-augmented generation with a tool-calling loop)</h1>

  <div class="figure">
    <svg viewBox="0 0 1000 1870" role="img" aria-label="Flowchart of how the chat agent loads the data once, reads an attached client report and checks it against the messages when the first prompt is sent with it, then for each question retrieves facts, reference topics and the report results, sends the memory notes with the conversation, answers in rounds of model requests and tool calls, checks the answer for table and column names, and saves the conversation in the browser">
      <defs>
        <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z"/></marker>
      </defs>

      <text class="ph" x="130" y="30">ONCE, WHEN THE DATABASE KEY IS ENTERED</text>

      <rect class="b web" x="130" y="45" width="340" height="70" rx="10"/>
      <text class="t" x="300" y="75">Analyst enters the database key</text>
      <text class="sm" x="300" y="97">web/app.js</text>
      <g class="badge"><circle cx="130" cy="45" r="13"/><text x="130" y="45">A</text></g>

      <rect class="b data" x="130" y="145" width="340" height="80" rx="10"/>
      <text class="t" x="300" y="173">Get the 9 gold tables</text>
      <text class="s" x="300" y="194">from cloud storage, or from the copy</text>
      <text class="s" x="300" y="211">saved in this browser</text>
      <g class="badge"><circle cx="130" cy="145" r="13"/><text x="130" y="145">B</text></g>

      <rect class="b data" x="130" y="255" width="340" height="80" rx="10"/>
      <text class="t" x="300" y="283">Create the tables in the browser</text>
      <text class="s" x="300" y="304">in-browser database (DuckDB-WASM);</text>
      <text class="s" x="300" y="321">file and network access switched off</text>
      <g class="badge"><circle cx="130" cy="255" r="13"/><text x="130" y="255">C</text></g>

      <path class="arrow" d="M300,115 V141"/>
      <path class="arrow" d="M300,225 V251"/>
      <path class="arrow" d="M300,335 V386" style="stroke-dasharray:5 4"/>

      <text class="ph" x="610" y="30">WHEN A CLIENT REPORT IS ATTACHED</text>

      <rect class="b web" x="610" y="45" width="370" height="70" rx="10"/>
      <text class="t" x="795" y="75">Analyst attaches the client's report</text>
      <text class="s" x="795" y="97">read in the browser; only its name is shown</text>
      <g class="badge"><circle cx="610" cy="45" r="13"/><text x="610" y="45">R1</text></g>

      <rect class="b data" x="610" y="145" width="370" height="80" rx="10"/>
      <text class="t" x="795" y="171">First prompt: check each test step</text>
      <text class="s" x="795" y="192">the client's IDs looked up in the tables;</text>
      <text class="s" x="795" y="209">one result per step by a fixed rule, not the model</text>
      <g class="badge"><circle cx="610" cy="145" r="13"/><text x="610" y="145">R2</text></g>

      <rect class="b web" x="610" y="255" width="370" height="80" rx="10"/>
      <text class="t" x="795" y="283">Closed section under the first answer</text>
      <text class="s" x="795" y="304">opened by a click: the result of each step,</text>
      <text class="s" x="795" y="321">Excel and PDF report buttons</text>
      <g class="badge"><circle cx="610" cy="255" r="13"/><text x="610" y="255">R3</text></g>

      <path class="arrow" d="M795,115 V141" style="stroke-dasharray:5 4"/>
      <path class="arrow" d="M795,225 V251"/>
      <path class="arrow" d="M470,410 H540 V185 H606" style="stroke-dasharray:5 4"/>
      <text class="s" x="548" y="375" style="text-anchor:start">first prompt after attaching</text>
      <path class="arrow" d="M795,335 V451" style="stroke-dasharray:5 4"/>
      <text class="s" x="803" y="398" style="text-anchor:start">results kept until the</text>
      <text class="s" x="803" y="415" style="text-anchor:start">report is removed</text>

      <text class="ph" x="130" y="375">FOR EVERY QUESTION</text>

      <rect class="b web" x="130" y="390" width="340" height="70" rx="10"/>
      <text class="t" x="300" y="420">Analyst asks a question</text>
      <text class="s" x="300" y="442">added to the conversation</text>
      <g class="badge"><circle cx="130" cy="390" r="13"/><text x="130" y="390">1</text></g>

      <rect class="b data" x="130" y="490" width="340" height="100" rx="10"/>
      <text class="t" x="300" y="518">Agent retrieves before asking the model</text>
      <text class="s" x="300" y="541">summary queries on the in-browser tables</text>
      <text class="s" x="300" y="558">and reference topics, added to the question</text>
      <text class="sm" x="300" y="577">web/retrieve.js</text>
      <g class="badge"><circle cx="130" cy="490" r="13"/><text x="130" y="490">2</text></g>

      <rect class="b ai" x="130" y="620" width="340" height="100" rx="10"/>
      <text class="t" x="300" y="646">Agent builds the request</text>
      <text class="s" x="300" y="668">same instructions, example queries, core reference</text>
      <text class="s" x="300" y="685">and table columns every time, + memory notes</text>
      <text class="s" x="300" y="702">+ the conversation · 7 tools (9 with a report)</text>
      <g class="badge"><circle cx="130" cy="620" r="13"/><text x="130" y="620">3</text></g>

      <rect class="b ai" x="130" y="750" width="340" height="70" rx="10"/>
      <text class="t" x="300" y="778">Send the request to the language model</text>
      <text class="sm" x="300" y="800">nvidia/nemotron-3.5-lightning:free</text>
      <g class="badge"><circle cx="130" cy="750" r="13"/><text x="130" y="750">4</text></g>

      <polygon class="b dec" points="300,845 440,895 300,945 160,895"/>
      <text class="dt" x="300" y="890">Does the reply</text>
      <text class="dt" x="300" y="908">call any tools?</text>
      <g class="badge"><circle cx="160" cy="895" r="13"/><text x="160" y="895">5</text></g>

      <rect class="b data" x="130" y="975" width="340" height="80" rx="10"/>
      <text class="t" x="300" y="1003">Agent runs each tool call</text>
      <text class="s" x="300" y="1024">on the in-browser tables or</text>
      <text class="s" x="300" y="1041">the reference files</text>
      <g class="badge"><circle cx="130" cy="975" r="13"/><text x="130" y="975">6</text></g>

      <rect class="b ai" x="130" y="1085" width="340" height="80" rx="10"/>
      <text class="t" x="300" y="1113">Add the results to the conversation</text>
      <text class="s" x="300" y="1134">each result cut to at most 200 rows</text>
      <text class="s" x="300" y="1151">and 30,000 characters</text>
      <g class="badge"><circle cx="130" cy="1085" r="13"/><text x="130" y="1085">7</text></g>

      <polygon class="b dec" points="300,1190 440,1240 300,1290 160,1240"/>
      <text class="dt" x="300" y="1236">12 requests to the</text>
      <text class="dt" x="300" y="1254">model used?</text>
      <g class="badge"><circle cx="160" cy="1240" r="13"/><text x="160" y="1240">8</text></g>

      <rect class="b ai" x="130" y="1320" width="340" height="80" rx="10"/>
      <text class="t" x="300" y="1348">One last request, tools switched off</text>
      <text class="s" x="300" y="1369">the model must answer from the</text>
      <text class="s" x="300" y="1386">results it already has</text>

      <polygon class="b dec" points="300,1425 440,1475 300,1525 160,1475"/>
      <text class="dt" x="300" y="1470">Does the answer name</text>
      <text class="dt" x="300" y="1488">tables, columns or SQL?</text>
      <g class="badge"><circle cx="160" cy="1475" r="13"/><text x="160" y="1475">9</text></g>

      <rect class="b ai" x="130" y="1555" width="340" height="80" rx="10"/>
      <text class="t" x="300" y="1583">One rewrite request, tools off</text>
      <text class="s" x="300" y="1604">the same numbers and conclusions,</text>
      <text class="s" x="300" y="1621">in plain words</text>

      <rect class="b web" x="130" y="1665" width="340" height="70" rx="10"/>
      <text class="t" x="300" y="1695">Page shows the answer text</text>
      <text class="s" x="300" y="1717">the queries are not shown</text>
      <g class="badge"><circle cx="130" cy="1665" r="13"/><text x="130" y="1665">10</text></g>

      <rect class="b web" x="130" y="1765" width="340" height="80" rx="10"/>
      <text class="t" x="300" y="1793">Save the conversation in the browser</text>
      <text class="s" x="300" y="1814">and update the context bar</text>
      <text class="sm" x="300" y="1832">web/memory.js</text>
      <g class="badge"><circle cx="130" cy="1765" r="13"/><text x="130" y="1765">11</text></g>
      <path class="arrow" d="M300,1735 V1761"/>
      <path class="arrow" d="M474,1805 H795 V1714" style="stroke-dasharray:5 4"/>

      <!-- main arrows -->
      <path class="arrow" d="M300,460 V486"/>
      <path class="arrow" d="M300,590 V616"/>
      <path class="arrow" d="M300,720 V746"/>
      <path class="arrow" d="M300,820 V841"/>
      <path class="arrow" d="M300,945 V971"/>
      <text class="yn" x="308" y="966">Yes</text>
      <path class="arrow" d="M300,1055 V1081"/>
      <path class="arrow" d="M300,1165 V1186"/>
      <path class="arrow" d="M300,1290 V1316"/>
      <text class="yn" x="308" y="1310">Yes</text>
      <path class="arrow" d="M300,1400 V1421"/>
      <path class="arrow" d="M300,1525 V1551"/>
      <text class="yn" x="308" y="1545">Yes</text>
      <path class="arrow" d="M300,1635 V1661"/>

      <!-- No from decision 5: the reply is the answer, checked at decision 9 -->
      <path class="arrow" d="M160,895 H60 V1475 H156"/>
      <text class="yn" x="100" y="887">No</text>
      <text class="yn" transform="translate(52,1185) rotate(-90)" style="text-anchor:middle">No tool call: the reply is the answer</text>

      <!-- No from decision 8: next round -->
      <path class="arrow" d="M440,1240 H560 V785 H474"/>
      <text class="yn" x="450" y="1230">No</text>
      <text class="s" x="568" y="850" style="text-anchor:start">next round</text>

      <!-- No from decision 9: show the answer -->
      <path class="arrow" d="M440,1475 H520 V1700 H474"/>
      <text class="yn" x="450" y="1465">No</text>

      <!-- what step 2 retrieves -->
      <rect class="b data" x="610" y="455" width="370" height="225" rx="10"/>
      <text class="tl" x="626" y="481" style="font-weight:700">What step 2 adds to the question</text>
      <text class="tl" x="626" y="507">A CompID named in it, or in an earlier question:</text>
      <text class="tl" x="640" y="527">activity per month, messages per type,</text>
      <text class="tl" x="640" y="547">rejections per reject code with meanings,</text>
      <text class="tl" x="640" y="567">and how its orders ended</text>
      <text class="tl" x="626" y="593">A month: the same facts for that month only</text>
      <text class="tl" x="626" y="613">A reject code: its meaning</text>
      <text class="tl" x="626" y="639">Words such as test, session or logon: up to 2 topics</text>
      <text class="tl" x="626" y="665">An attached report: the result of every test step</text>
      <path class="arrow" d="M606,540 H474" style="stroke-dasharray:5 4"/>

      <!-- tools -->
      <rect class="b data" x="610" y="930" width="370" height="330" rx="10"/>
      <text class="tl" x="626" y="956" style="font-weight:700">The tools the model can call</text>
      <text class="tlm" x="626" y="984">run_sql</text><text class="tl" x="730" y="984">runs one SELECT query on the tables</text>
      <text class="tlm" x="626" y="1010">describe_table</text><text class="tl" x="738" y="1010">common values of each column</text>
      <text class="tlm" x="626" y="1036">read_reference</text><text class="tl" x="740" y="1036">one JSE reference topic</text>
      <text class="tlm" x="626" y="1062">lookup_reject_codes</text><text class="tl" x="776" y="1062">reject code meanings</text>
      <text class="tl" x="626" y="1092" style="font-weight:700">Added when a report is attached:</text>
      <text class="tlm" x="626" y="1118">get_test_evidence</text><text class="tl" x="762" y="1118">messages of one test step</text>
      <text class="tlm" x="626" y="1144">create_client_report</text><text class="tl" x="786" y="1144">Excel or PDF file</text>
      <text class="tl" x="626" y="1174" style="font-weight:700">Always sent, for memory:</text>
      <text class="tlm" x="626" y="1200">save_memory</text><text class="tl" x="718" y="1200">saves one memory note</text>
      <text class="tlm" x="626" y="1226">forget_memory</text><text class="tl" x="732" y="1226">deletes a note</text>
      <text class="tlm" x="626" y="1252">search_past_conversations</text>
      <path class="arrow" d="M606,1015 H474" style="stroke-dasharray:5 4"/>

      <!-- memory -->
      <rect class="b web" x="610" y="1290" width="370" height="420" rx="10"/>
      <text class="tl" x="626" y="1316" style="font-weight:700">Memory, kept in this browser (IndexedDB)</text>
      <text class="tl" x="626" y="1344">Every conversation: questions, answers and</text>
      <text class="tl" x="640" y="1364">attached reports. The last one is opened</text>
      <text class="tl" x="640" y="1384">again after a reload; the sidebar lists the rest.</text>
      <text class="tl" x="626" y="1412">Memory notes: facts the model saved with</text>
      <text class="tl" x="640" y="1432">save_memory, sent with every question of</text>
      <text class="tl" x="640" y="1452">every conversation (step 3).</text>
      <text class="tl" x="626" y="1480">Context bar: the tokens the next request</text>
      <text class="tl" x="640" y="1500">starts with, counted by OpenRouter for the</text>
      <text class="tl" x="640" y="1520">last request. Amber from 32,000, red from</text>
      <text class="tl" x="640" y="1540">64,000; the model accepts 1,000,000.</text>
      <text class="tl" x="626" y="1568">Continue in a new conversation: one request</text>
      <text class="tl" x="640" y="1588">with no tools writes a summary of at most</text>
      <text class="tl" x="640" y="1608">300 words. The new conversation starts</text>
      <text class="tl" x="640" y="1628">with it and sends it with every question.</text>
      <text class="tl" x="626" y="1656">Not shared with other computers or analysts;</text>
      <text class="tl" x="640" y="1676">deleted when the browser's site data is cleared.</text>
    </svg>
    <div class="legend">
      <span class="l-web">Chat page and analyst</span>
      <span class="l-ai">Agent and language model</span>
      <span class="l-data">Data and tools</span>
      <span class="l-dec">Decision</span>
    </div>
  </div>
</main>
