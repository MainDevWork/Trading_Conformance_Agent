    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1240px; margin: 0 auto; padding: 32px 16px 48px; }
  nav { font-size: 13px; margin-bottom: 18px; color: var(--muted); }
  nav a { color: inherit; margin-right: 14px; }
  a { color: var(--muted); }
  h1 { font-size: 24px; margin: 0 0 18px; }
  code { font: 13px ui-monospace, Consolas, monospace; }
  .figure { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; overflow-x: auto; margin-bottom: 24px; }
  svg { display: block; width: 100%; height: auto; }
  svg text { fill: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .box { fill: var(--panel); stroke-width: 1.5; }
  .bz { stroke: var(--bz-edge); } .bz-h { fill: var(--bz); stroke: var(--bz-edge); stroke-width: 1.5; }
  .sv { stroke: var(--sv-edge); } .sv-h { fill: var(--sv); stroke: var(--sv-edge); stroke-width: 1.5; }
  .ex { stroke: var(--ex-edge); } .ex-h { fill: var(--ex); stroke: var(--ex-edge); stroke-width: 1.5; }
  .pkg { fill: none; stroke: var(--muted); stroke-width: 1.2; }
  svg .pk { font-weight: 700; font-size: 14px; }
  svg .st { font-size: 11px; fill: var(--muted); }
  svg .tn { font: 700 14px ui-monospace, Consolas, monospace; }
  svg .it { font-style: italic; }
  svg .ts { font-size: 11.5px; fill: var(--muted); }
  svg .f { font: 12px ui-monospace, Consolas, monospace; }
  svg .k { font-weight: 700; }
  svg .m { font: 700 12px ui-monospace, Consolas, monospace; }
  svg .lb { font-size: 12px; font-style: italic; fill: var(--muted); }
  .ln { fill: none; stroke: var(--line); stroke-width: 1.4; }
  .tri { fill: var(--panel); stroke: var(--line); stroke-width: 1.4; }
  table { border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); font-size: 14px; width: 100%; }
  th, td { padding: 10px 12px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
  thead th { font-size: 12px; color: var(--muted); }
  td.r { text-align: right; white-space: nowrap; }
  td.c { text-align: center; font: 600 14px ui-monospace, Consolas, monospace; }
  td.n { white-space: nowrap; }
  .client { color: var(--client); font-weight: 600; }
  .jse { color: var(--jse); font-weight: 600; }
  .both { color: var(--both); font-weight: 600; }
  svg { min-width: 900px; }
</style>
